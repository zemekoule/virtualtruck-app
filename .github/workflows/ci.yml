name: CI

on:
  pull_request:
  push:
    branches: [main]
  # New advisories appear without any change in the repository.
  schedule:
    - cron: '17 6 * * 1'
  # Checks before a deployment (deploy.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # The tests run on the database the app runs on, not on the sqlite of phpunit.xml.
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: virtualtruck
          MARIADB_USER: virtualtruck
          MARIADB_PASSWORD: virtualtruck
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer audit
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: php artisan test
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: virtualtruck
          DB_USERNAME: virtualtruck
          DB_PASSWORD: virtualtruck

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The map code of the page is in the submodule.
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Only what goes to the page; the dev tools (vite and its picomatch) have an advisory without a fix.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc
      - run: git -C ../tools/trucksim-maps apply ../trucksim-maps.patch
      - run: npx vite build
