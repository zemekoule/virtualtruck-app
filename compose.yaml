name: virtualtruck

services:
  api:
    build: docker/php
    command: php artisan serve --host 0.0.0.0 --port 8000
    ports:
      - "8100:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:24-alpine
    working_dir: /app/web
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5180:5173"
    volumes:
      - .:/app
      # Linux builds of the native packages, the host node_modules are for macOS.
      - web_node_modules:/app/web/node_modules
    depends_on:
      - api

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: virtualtruck
      MARIADB_USER: virtualtruck
      MARIADB_PASSWORD: virtualtruck
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30
    volumes:
      - db:/var/lib/mysql

volumes:
  db:
  web_node_modules:
